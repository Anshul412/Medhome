<header class="border-b border-slate-200 bg-white">
  <nav class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8"
       aria-label="Main navigation">
    <a class="text-xl font-semibold text-teal-700" href="/">MedHome</a>
    <div class="flex flex-wrap items-center gap-4 text-sm text-slate-600">
      {% if user.is_authenticated %}
        <a href="{% url 'accounts:profile_switch' %}" class="hover:text-teal-700">Profiles</a>
        <a href="{% url 'vitals:log' %}" class="hover:text-teal-700">Vitals</a>
        <a href="{% url 'prescriptions:list' %}" class="hover:text-teal-700">Medical vault</a>
        <a href="{% url 'reminders:dashboard' %}" class="hover:text-teal-700">Reminders</a>
        <a href="{% url 'emergency:dashboard' %}" class="hover:text-teal-700">Emergency</a>
        <form method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button class="hover:text-teal-700" type="submit">Log out</button>
        </form>
      {% else %}
        <a href="{% url 'accounts:login' %}" class="hover:text-teal-700">Log in</a>
        <a href="{% url 'accounts:signup' %}" class="hover:text-teal-700">Sign up</a>
      {% endif %}
    </div>
  </nav>
</header>
